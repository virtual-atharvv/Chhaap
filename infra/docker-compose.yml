version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: chhaap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chhaap
      POSTGRES_PASSWORD: chhaap_password
      POSTGRES_DB: chhaap
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../packages/db/src/schema.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: chhaap-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
