<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Order Status · Chhaap</title>
  <style>
    :root { color-scheme: light; --ink:#15202b; --muted:#5c6b7a; --brand:#0f766e; --bg:#f6f8f7; --card:#fff; --line:#dbe4e1; --warn:#9a3412; --ok:#166534; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
    main { max-width:600px; margin:0 auto; padding:28px 18px 72px; }
    header { display:flex; justify-content:space-between; gap:12px; align-items:center; margin-bottom:20px; }
    h1 { font-size:24px; margin:0; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:24px; margin:14px 0; text-align:center; }
    .pickup-token { font-size:48px; font-weight:800; color:var(--brand); letter-spacing:3px; margin:16px 0 8px; font-family:monospace; }
    .status-badge { display:inline-block; padding:6px 14px; border-radius:999px; font-size:14px; font-weight:600; margin-bottom:12px; }
    .badge-awaiting { background:#fef3c7; color:#92400e; }
    .badge-paid { background:#e0f2fe; color:#0369a1; }
    .badge-queued { background:#e0e7ff; color:#3730a3; }
    .badge-printing { background:#fef9c3; color:#854d0e; }
    .badge-ready { background:#dcfce7; color:#166534; }
    .badge-failed { background:#fee2e2; color:#991b1b; }
    .details { text-align:left; margin-top:20px; border-top:1px solid var(--line); padding-top:16px; font-size:14px; }
    .line { display:flex; justify-content:space-between; padding:4px 0; }
    .muted { color:var(--muted); font-size:13px; }
    .err { color:var(--warn); font-weight:600; }
    .hidden { display:none; }
    a { color:var(--brand); text-decoration:none; }
    .timeline { display:flex; justify-content:space-between; margin:24px 0 16px; position:relative; }
    .timeline::before { content:''; position:absolute; top:12px; left:20px; right:20px; height:2px; background:var(--line); z-index:0; }
    .step { position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; font-size:11px; color:var(--muted); }
    .step-dot { width:24px; height:24px; border-radius:50%; background:#e2e8f0; display:flex; align-items:center; justify-content:center; font-weight:bold; margin-bottom:4px; }
    .step.active .step-dot { background:var(--brand); color:#fff; }
    .step.done .step-dot { background:#166534; color:#fff; }
  </style>
</head>
<body>
<main>
  <header>
    <h1>Print Order</h1>
    <span id="order-short-id" class="muted"></span>
  </header>

  <div id="error-box" class="card hidden">
    <p class="err" id="error-msg"></p>
    <p class="muted"><a href="/">Return to Home</a></p>
  </div>

  <div id="status-card" class="card">
    <div id="badge" class="status-badge badge-awaiting">Loading status…</div>
    <div id="token-box" class="hidden">
      <p class="muted" style="margin:0">Your pickup token</p>
      <div id="pickup-token" class="pickup-token">---</div>
      <p style="font-weight:600; margin:4px 0">Show this code at the shop counter</p>
    </div>

    <div class="timeline" id="timeline">
      <div class="step" id="step-pay"><div class="step-dot">1</div><span>Payment</span></div>
      <div class="step" id="step-queue"><div class="step-dot">2</div><span>Queued</span></div>
      <div class="step" id="step-print"><div class="step-dot">3</div><span>Printing</span></div>
      <div class="step" id="step-ready"><div class="step-dot">4</div><span>Ready</span></div>
    </div>

    <p id="status-desc" class="muted">Connecting to printer status updates…</p>

    <div class="details" id="order-details">
      <div class="line"><span>Shop</span><strong id="det-shop">—</strong></div>
      <div class="line"><span>Total Paid</span><strong id="det-total">—</strong></div>
      <div class="line"><span>Status</span><span id="det-status">—</span></div>
    </div>
  </div>

  <p class="muted" style="text-align:center"><a href="/">← Print another document</a></p>
</main>

<script>
  const orderId = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || '');
  let token = null;

  const hashMatch = location.hash.match(/[#&]t=([^&]+)/);
  if (hashMatch) {
    token = decodeURIComponent(hashMatch[1]);
  }
  if (token) {
    try {
      const stored = JSON.parse(sessionStorage.getItem('chhaap_order_tokens') || '{}');
      stored[orderId] = token;
      sessionStorage.setItem('chhaap_order_tokens', JSON.stringify(stored));
    } catch {}
  } else {
    try {
      const stored = JSON.parse(sessionStorage.getItem('chhaap_order_tokens') || '{}');
      token = stored[orderId] || null;
    } catch {}
  }

  const $ = (id) => document.getElementById(id);
  $('order-short-id').textContent = '#' + orderId.slice(0, 8);

  function showError(msg) {
    $('error-msg').textContent = msg;
    $('error-box').classList.remove('hidden');
    $('status-card').classList.add('hidden');
  }

  function money(paise) {
    return '₹' + (paise / 100).toFixed(2);
  }

  const STEPS = ['pay', 'queue', 'print', 'ready'];

  function updateTimeline(activeStepIndex) {
    STEPS.forEach((step, idx) => {
      const el = $('step-' + step);
      if (!el) return;
      el.className = 'step';
      if (idx < activeStepIndex) el.classList.add('done');
      else if (idx === activeStepIndex) el.classList.add('active');
    });
  }

  function renderStatus(order) {
    $('det-total').textContent = money(order.totalPaise);
    $('det-status').textContent = order.status;

    const b = $('badge');
    const tokenBox = $('token-box');
    const desc = $('status-desc');

    tokenBox.classList.add('hidden');

    switch (order.status) {
      case 'draft':
      case 'awaiting_payment':
        b.className = 'status-badge badge-awaiting';
        b.textContent = 'Awaiting payment';
        desc.textContent = 'Awaiting payment confirmation. Order expires after 15 minutes if unpaid.';
        updateTimeline(0);
        break;
      case 'paid':
        b.className = 'status-badge badge-paid';
        b.textContent = 'Paid ✓';
        desc.textContent = 'Payment received! Sending to shop printer queue…';
        updateTimeline(1);
        break;
      case 'queued':
        b.className = 'status-badge badge-queued';
        b.textContent = 'Queued for printing';
        desc.textContent = 'Document is queued at the shop printer.';
        updateTimeline(1);
        break;
      case 'printing':
        b.className = 'status-badge badge-printing';
        b.textContent = 'Printing…';
        desc.textContent = 'The printer is actively printing your document.';
        updateTimeline(2);
        break;
      case 'completed':
        b.className = 'status-badge badge-ready';
        b.textContent = 'Ready for pickup!';
        desc.textContent = 'Your prints are ready! Collect them from the counter.';
        $('pickup-token').textContent = order.pickupToken || 'Ready';
        tokenBox.classList.remove('hidden');
        updateTimeline(3);
        stopLive();
        break;
      case 'failed':
        b.className = 'status-badge badge-failed';
        b.textContent = 'Printing failed';
        desc.textContent = 'There was an issue printing this document. A refund will be initiated if payment was captured.';
        stopLive();
        break;
      case 'refunded':
        b.className = 'status-badge badge-failed';
        b.textContent = 'Refunded';
        desc.textContent = 'Payment has been refunded.';
        stopLive();
        break;
      case 'expired':
        b.className = 'status-badge badge-failed';
        b.textContent = 'Order expired';
        desc.textContent = 'This order expired because payment was not completed in time.';
        stopLive();
        break;
    }
  }

  let sse = null;
  let pollTimer = null;

  function stopLive() {
    if (sse) { sse.close(); sse = null; }
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  async function fetchOrder() {
    if (!token) return;
    try {
      const res = await fetch('/v1/orders/' + encodeURIComponent(orderId) + '?token=' + encodeURIComponent(token));
      if (!res.ok) {
        if (res.status === 403 || res.status === 404) {
          showError('Unable to access order. Invalid or missing token.');
          stopLive();
        }
        return;
      }
      const data = await res.json();
      if (data.order) renderStatus(data.order);
      if (data.shop) $('det-shop').textContent = data.shop.name;
    } catch {}
  }

  function startLive() {
    fetchOrder();
    try {
      sse = new EventSource('/v1/orders/' + encodeURIComponent(orderId) + '/stream?token=' + encodeURIComponent(token));
      sse.onmessage = (event) => {
        try {
          const parsed = JSON.parse(event.data);
          if (parsed && parsed.status) {
            fetchOrder();
          }
        } catch {}
      };
      sse.onerror = () => {
        if (sse) { sse.close(); sse = null; }
        startPolling();
      };
    } catch {
      startPolling();
    }
  }

  function startPolling() {
    if (pollTimer) return;
    pollTimer = setInterval(fetchOrder, 3000);
  }

  if (!token) {
    showError('Order access token missing. Please open the link from your confirmation or restart your order.');
  } else {
    startLive();
  }
</script>
</body>
</html>
